name: Weekly catalog sweep

# Rebuilds site/data/catalog.json (every AI-related repository above the star
# threshold), its slim web copy and CATALOG.md. The sweep takes about an hour
# and the candidate pool changes slowly, so it runs weekly.
#
# The two catalog files (about 28 MB) are not committed. They are handed to
# the "White Score refresh" workflow (daily.yml) through the Actions cache; the
# next refresh, within four hours, scores from the new catalog and deploys it
# with the site, which then serves it at data/catalog.json. Only CATALOG.md,
# the readable digest, is committed.

on:
  schedule:
    - cron: "41 2 * * 0"        # Sundays, 02:41 UTC
  workflow_dispatch:

permissions:
  contents: write               # CATALOG.md

concurrency:
  group: whitescore-data        # never run alongside the refresh
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Sweep GitHub for AI repositories
        env:
          GITHUB_TOKEN: ${{ secrets.WHITESCORE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: python -m whitescore.catalog

      - name: Export CATALOG.md
        run: python scripts/export_catalog_md.py

      # The refresh restores the newest "whitescore-catalog-*" entry.
      - name: Hand the catalog to the refresh workflow
        uses: actions/cache/save@v4
        with:
          path: |
            site/data/catalog.json
            site/data/catalog-web.json
          key: whitescore-catalog-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Commit CATALOG.md
        run: |
          git add CATALOG.md
          if git diff --cached --quiet; then
            echo "No catalog changes"
          else
            git config user.name "whitescore-bot"
            git config user.email "whitescore-bot@users.noreply.github.com"
            git commit -m "data: weekly catalog sweep $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi
