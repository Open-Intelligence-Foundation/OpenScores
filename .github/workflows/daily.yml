name: White Score refresh

# Four runs a day. Each fully recollects the ~250 repositories whose cached
# metrics are a day old (about 2,600 requests, inside one hour of a personal
# token's 5,000/hour budget) and refreshes the other ~750 with 15 light GraphQL
# requests, so every project is fully recollected daily and its stars, forks,
# issues, pull requests and last commit are at most six hours old.
#
# A run commits nothing except the score history, once a day. The collector's
# state (metrics cache, token preferences, history) travels from run to run in
# the Actions cache; the live Pages site serves the same files and is the
# fallback when the cache has nothing (first run, or caches evicted after a
# week without runs). The site is deployed straight from the run's working
# tree, so main stays code-only and the repository does not grow with the data.
on:
  schedule:
    - cron: "17 */6 * * *"      # 00:17, 06:17, 12:17, 18:17 UTC
  workflow_dispatch:
    inputs:
      max_repos:
        description: "Maximum repositories to track"
        default: "1000"
      max_full:
        description: "Full (expensive) collections this run; the rest refresh from cache (-1 = all due)"
        default: "300"

permissions:
  contents: write               # the daily score-history commit
  pages: write
  id-token: write

concurrency:
  group: whitescore-data        # shared with the weekly catalog sweep
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Each run saves its state under a new key, so the prefix restores the
      # newest one. Entries that are never restored again expire after a week.
      - name: Restore the collector's state from the previous run
        id: state
        uses: actions/cache/restore@v4
        with:
          path: |
            data/metrics-cache.json
            data/token-preferences.json
            site/data/history.json
          key: whitescore-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: whitescore-state-

      # The candidate pool comes from site/data/catalog.json, which the
      # "Weekly catalog sweep" workflow (catalog.yml) rebuilds and caches.
      - name: Restore the catalog from the last weekly sweep
        id: catalog
        uses: actions/cache/restore@v4
        with:
          path: |
            site/data/catalog.json
            site/data/catalog-web.json
          key: whitescore-catalog-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: whitescore-catalog-

      - uses: actions/configure-pages@v5
        id: pages

      # The deployed site carries every state file, so a cache miss costs
      # nothing as long as the site has been deployed once. Only a fresh
      # repository starts from scratch: live discovery instead of the catalog,
      # and a full collection of every repository over the first few runs.
      - name: Fall back to the live site for files the caches did not have
        if: steps.state.outputs.cache-matched-key == '' || steps.catalog.outputs.cache-matched-key == ''
        env:
          SITE: ${{ steps.pages.outputs.base_url }}
          STATE_RESTORED: ${{ steps.state.outputs.cache-matched-key }}
        run: |
          # The checked-out history.json is the day's commit; the site's copy is at least as new.
          [ -n "$STATE_RESTORED" ] || rm -f site/data/history.json
          for f in data/metrics-cache.json data/token-preferences.json \
                   site/data/history.json site/data/catalog.json site/data/catalog-web.json; do
            [ -s "$f" ] && continue
            if curl -fsSL --retry 3 "$SITE/data/$(basename "$f")" -o "$f.download"; then
              mv "$f.download" "$f" && echo "restored $f from the live site"
            else
              rm -f "$f.download" && echo "$f: not on the live site either, starting without it"
            fi
          done
          # Back to the committed copy, if there is one (a fresh fork has none yet).
          [ -s site/data/history.json ] || git checkout -- site/data/history.json 2>/dev/null || true

      - name: Collect and score
        env:
          # Primary token: a classic PAT (public_repo scope) reads everything,
          # including Sponsors data and the stargazer timeline, with a 5,000
          # requests/hour budget. The default GITHUB_TOKEN works but is limited
          # to 1,000 req/h, so lower MAX_FULL_COLLECT if you rely on it.
          GITHUB_TOKEN: ${{ secrets.WHITESCORE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          # Optional fallback: a fine-grained PAT for repositories whose
          # organization refuses classic tokens. Repositories that needed it are
          # remembered in data/token-preferences.json.
          GITHUB_TOKEN_FALLBACK: ${{ secrets.WHITESCORE_GITHUB_TOKEN_FALLBACK }}
          MAX_REPOS: ${{ github.event.inputs.max_repos || '1000' }}
          MAX_FULL_COLLECT: ${{ github.event.inputs.max_full || '300' }}
        run: python -m whitescore

      - name: Save the collector's state for the next run
        uses: actions/cache/save@v4
        with:
          path: |
            data/metrics-cache.json
            data/token-preferences.json
            site/data/history.json
          key: ${{ steps.state.outputs.cache-primary-key }}

      - name: Publish the state files with the site (the fallback for a cache miss)
        run: |
          for f in data/metrics-cache.json data/token-preferences.json; do
            [ -f "$f" ] && cp "$f" site/data/
          done
          ls -la site/data

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # The one thing a run commits: the score series, on the first successful
      # run of each UTC day (a few tens of kilobytes in git). It is a durable
      # record of the scores and keeps the repository active, so GitHub does
      # not disable the schedule after 60 days without commits.
      - name: Commit the score history once a day
        run: |
          today=$(date -u +%F)
          if git show HEAD:site/data/history.json 2>/dev/null | python -c '
          import json, sys
          try:
              history = json.load(sys.stdin)
          except ValueError:
              sys.exit(1)
          sys.exit(0 if any(s and s[-1]["d"] == sys.argv[1] for s in history.values()) else 1)
          ' "$today"; then
            echo "Score history for $today is already committed"
            exit 0
          fi
          git add site/data/history.json
          if git diff --cached --quiet; then
            echo "Score history unchanged"
            exit 0
          fi
          git config user.name "whitescore-bot"
          git config user.email "whitescore-bot@users.noreply.github.com"
          git commit -m "data: score history $today"
          git pull --rebase origin main
          git push

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
