name: Daily White Score refresh

on:
  schedule:
    - cron: "17 6 * * *"        # once a day, 06:17 UTC
  workflow_dispatch:
    inputs:
      max_repos:
        description: "Maximum repositories to track"
        default: "300"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: whitescore-refresh
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Refresh catalog (full GitHub sweep)
        env:
          GITHUB_TOKEN: ${{ secrets.WHITESCORE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: python -m whitescore.catalog

      - name: Collect and score
        env:
          # A classic or fine-grained PAT (public repo read access) gets the full
          # 5,000 req/h budget. The default GITHUB_TOKEN works but is limited to
          # 1,000 req/h, so lower MAX_REPOS if you rely on it.
          GITHUB_TOKEN: ${{ secrets.WHITESCORE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          MAX_REPOS: ${{ github.event.inputs.max_repos || '300' }}
        run: python -m whitescore

      - name: Commit updated data
        run: |
          git config user.name "whitescore-bot"
          git config user.email "whitescore-bot@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: daily White Score refresh $(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
